<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Post &mdash; WWP Counseling</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#3F5A48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .post-wrap { max-width: 700px; margin: 0 auto; padding: 56px 24px 96px; }
  .post-meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--moss-light); margin-bottom: 6px; }
  .post-body { margin-top: 32px; font-size: 1.05rem; }
  .post-body h1 { font-size: 1.9rem; margin-bottom: 0.6em; }
  .post-body h2 { font-size: 1.3rem; margin-top: 1.6em; margin-bottom: 0.5em; }
  .post-body p { margin-bottom: 1.1em; }
  .post-body ul, .post-body ol { margin: 0 0 1.1em; padding-left: 1.4em; color: var(--ink-soft); }
  .back-link { display: inline-block; margin-bottom: 8px; font-size: 0.9rem; }
  .not-found { padding: 40px 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="index.html" class="logo"><img src="images/logo-mark.png" alt="" class="logo-mark">WWP <span>Counseling</span></a>
    <nav class="header-nav" id="header-nav" aria-label="Primary">
      <a href="index.html#directory">Browse counselors</a>
      <a href="blog.html">Blog</a>
      <a href="auth.html" class="nav-cta">Counselor login</a>
    </nav>
    <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="header-nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main class="post-wrap">
  <a class="back-link" href="blog.html">&larr; Back to blog</a>
  <div id="post-meta" class="post-meta"></div>
  <div id="post-body" class="post-body">Loading&hellip;</div>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <p>&copy; 2026 WWP Counseling. Not a substitute for emergency care.</p>
    <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a> &middot; <a href="index.html">Back to directory</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="posts/posts-index.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");
  const post = POSTS.find((p) => p.slug === slug);
  const bodyEl = document.getElementById("post-body");
  const metaEl = document.getElementById("post-meta");

  if (!post) {
    bodyEl.innerHTML = `<p class="not-found">Couldn't find that post. <a href="blog.html">Back to blog</a>.</p>`;
  } else {
    document.getElementById("page-title").textContent = post.title + " — WWP Counseling";
    const dateStr = new Date(post.date + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    metaEl.textContent = `${dateStr} · ${post.author}`;

    fetch(`posts/${post.slug}.md`)
      .then((res) => {
        if (!res.ok) throw new Error("Post file not found");
        return res.text();
      })
      .then((markdown) => {
        bodyEl.innerHTML = marked.parse(markdown);
      })
      .catch(() => {
        bodyEl.innerHTML = `<p class="not-found">Couldn't load this post right now.</p>`;
      });
  }

  // Mobile nav toggle
  const navToggle = document.getElementById("nav-toggle");
  const headerNav = document.getElementById("header-nav");
  navToggle.addEventListener("click", () => {
    const isOpen = headerNav.classList.toggle("is-open");
    navToggle.setAttribute("aria-expanded", String(isOpen));
  });
</script>
<script src="js/analytics.js"></script>
</body>
</html>
