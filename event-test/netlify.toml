[build]
  command = "npm run build"
  publish = "public"
  functions = "functions"
[functions]
  node_bundler = "esbuild"
[functions."maintenance"]
  schedule = "*/5 * * * *"
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/events/:splat"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/host.html"
  to = "/event-tool/host.html"
  status = 302
[[redirects]]
  from = "/guest.html"
  to = "/event-tool/guest.html"
  status = 302
[[redirects]]
  from = "/hosts.html"
  to = "/event-tool/hosts.html"
  status = 302
[[redirects]]
  from = "/events"
  to = "/events/index.html"
  status = 200
[[redirects]]
  from = "/host"
  to = "/event-tool/host.html"
  status = 302
[[redirects]]
  from = "/guest"
  to = "/event-tool/guest.html"
  status = 302
[[redirects]]
  from = "/hosts"
  to = "/event-tool/hosts.html"
  status = 302

[[redirects]]
  from = "/event"
  to = "/events"
  status = 302
  force = true
[[redirects]]
  from = "/event/*"
  to = "/events"
  status = 302
  force = true
