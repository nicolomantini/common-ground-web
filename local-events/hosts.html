<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host access · Common Ground</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="guest.css"></head><body><div class="test-banner">COMMON GROUND · TEST ENVIRONMENT</div><header><a class="brand" href="/#calendar/events">Common Ground</a><a href="/#calendar/events">Back to calendar</a></header><main><h1>Host access</h1><p>Add an individual account for each practitioner. Hosts can manage only events they are assigned to.</p><p id="message" role="status"></p><div id="accounts"></div><h2>Add or update a host</h2><form id="account-form"><label>Email<input name="email" type="email" required autocomplete="off"></label><label>Practitioner<select name="practitioner_id" required></select></label><label>Test password<input name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password"></label><p>At least 12 characters. Leave blank to keep an existing password. Share test credentials privately.</p><label><input name="active" type="checkbox" checked> Allow sign-in</label><button class="primary">Save host access</button></form></main><script src="hosts.js"></script></body></html>
