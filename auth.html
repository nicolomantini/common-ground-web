<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counselor login &mdash; WWP Counseling</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .auth-wrap { max-width: 420px; margin: 0 auto; padding: 72px 24px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .auth-tab {
    flex: 1; padding: 10px; text-align: center; border: 1px solid var(--line);
    background: var(--surface); border-radius: 10px; cursor: pointer; font-weight: 600;
    font-family: var(--font-body); color: var(--ink-soft);
  }
  .auth-tab.is-active { background: var(--moss); color: #fff; border-color: var(--moss); }
  .auth-form { display: flex; flex-direction: column; gap: 10px; }
  .auth-form[hidden] { display: none; }
  .auth-form[hidden] { display: none; }
  .auth-form label { font-size: 0.85rem; font-weight: 600; }
  .auth-form input, .auth-form textarea {
    font-family: var(--font-body); font-size: 0.95rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .auth-form textarea { resize: vertical; }
  .auth-message { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
  .auth-message.is-error { color: #a13d3d; }
  .auth-message.is-ok { color: var(--moss-deep); }
  .back-link { display: inline-block; margin-bottom: 24px; font-size: 0.9rem; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="index.html" class="logo">WWP <span>Counseling</span></a>
  </div>
</header>

<main class="auth-wrap">
  <a class="back-link" href="index.html">&larr; Back to directory</a>
  <h1>Counselor access</h1>
  <p>Log in if you already have an account, or request access to join.</p>

  <div class="auth-tabs">
    <button type="button" class="auth-tab is-active" data-tab="login">Log in</button>
    <button type="button" class="auth-tab" data-tab="request">Request access</button>
  </div>

  <form id="login-form" class="auth-form">
    <label for="login-email">Email</label>
    <input type="email" id="login-email" required autocomplete="email">
    <label for="login-password">Password</label>
    <input type="password" id="login-password" required autocomplete="current-password">
    <button type="submit" class="btn-primary">Log in</button>
  </form>

  <form id="request-form" class="auth-form" hidden>
    <p class="field-hint" style="margin-bottom: 4px;">
      Fill this in and we'll review your request. Once approved, you'll get an email
      with a link to set a password and log in.
    </p>
    <label for="request-name">Your name</label>
    <input type="text" id="request-name" required autocomplete="name">
    <label for="request-email">Email</label>
    <input type="email" id="request-email" required autocomplete="email">
    <label for="request-message">Anything you'd like us to know (optional)</label>
    <textarea id="request-message" rows="3"></textarea>
    <button type="submit" class="btn-primary">Send request</button>
  </form>

  <form id="set-password-form" class="auth-form" hidden>
    <p class="field-hint" style="margin-bottom: 4px;">Choose a password to finish setting up your account.</p>
    <label for="set-password">New password</label>
    <input type="password" id="set-password" required minlength="6" autocomplete="new-password">
    <label for="set-password-confirm">Confirm password</label>
    <input type="password" id="set-password-confirm" required minlength="6" autocomplete="new-password">
    <button type="submit" class="btn-primary">Set password &amp; continue</button>
  </form>

  <p id="auth-message" class="auth-message" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
