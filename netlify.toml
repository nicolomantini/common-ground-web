[build]
  command = "node scripts/build-site.cjs"
  publish = "site-build"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Read the public calendar and event cover metadata on the server.
[[redirects]]
  from = "/api/luma-events"
  to = "/.netlify/functions/luma-events"
  status = 200
  force = true
